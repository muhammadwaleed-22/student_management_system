{% extends "base.html" %}

{% block content %}
<div class="-mx-4 sm:-mx-6">
    <section class="border-b border-slate-200 ">
        <div class="mx-auto max-w-6xl px-4 py-12 sm:px-6">
            <p class="mb-3 text-xs font-bold uppercase tracking-widest text-blue-700">Admin Panel</p>
            <h1 class="text-4xl font-extrabold text-slate-900 sm:text-5xl" style="font-family: 'Sora', sans-serif;">Enrollments</h1>
            <p class="mt-3 max-w-2xl text-slate-600">View which students are enrolled in which courses.</p>
        </div>
    </section>

    <section class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        {% if data %}
        <div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
            <table class="min-w-full">
                <thead class="bg-slate-100 text-left">
                    <tr>
                        <th class="px-4 py-3 text-sm font-semibold text-slate-700">Student</th>
                        <th class="px-4 py-3 text-sm font-semibold text-slate-700">Course</th>
                    </tr>
                </thead>
                <tbody>
                    {% for row in data %}
                    <tr class="border-t border-slate-200">
                        <td class="px-4 py-3 text-sm font-medium text-slate-900">{{ row[0] }}</td>
                        <td class="px-4 py-3 text-sm text-slate-700">{{ row[1] }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="rounded-2xl border border-slate-200 bg-white p-6 text-sm text-slate-600">
            No enrollments found yet.
        </div>
        {% endif %}
    </section>
</div>
{% endblock %}
